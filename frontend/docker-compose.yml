
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api

    container_name: idp-frontend
    restart: unless-stopped

    ports:
      - "8080:80"

    networks:
      - idp-network

networks:
  idp-network:
    external: true
    name: idp-network
