
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: idp-backend
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "8000:8000"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - idp-network

networks:
  idp-network:
    name: idp-network
    driver: bridge
